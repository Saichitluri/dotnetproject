name: Terraform infra + Deploy dotnetapp
on:
  workflow_dispatch:
jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v6
            - name: Setup Terraform
              uses: hashicorp/setup-terraform@v3
            - name: azure login
              uses: azure/login@v2
              with:
                creds: ${{ secrets.AZURE_CREDENTIALS }}
            - name: Terraform init
              run: |
                terraform init
            - name: Terraform plan
              run: |
                cd Terraform
                terraform apply -auto-approve
            - name: Setup .NET
              uses: actions/setup-dotnet@v6
              with:
                dotnet-version: 10.0.x
            - name: Restore dependencies
              run: |
                cd NetflixProject
                dotnet restore
            - name: Build
              run: |
                cd NetflixProject
                dotnet build --configuration Release
            - name: Publish
              run: |
                cd NetflixProject
                dotnet publish -c Release -o ./publish
            - name: Deploy to Azure Web App
              uses: azure/webapps-deploy@v2
              with:
                    app-name: webapp-netflix-sai99
                    package: ./NetflixProject/publish